name: Stage npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      stage: ${{ steps.gate.outputs.stage }}
      node: ${{ steps.gate.outputs.node }}
      npm: ${{ steps.gate.outputs.npm }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and toolchain
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_REF: ${{ github.ref }}
        run: |
          exact='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          read_version() {
            jq -er --arg exact "$exact" '.version | strings | select(test($exact))' "$@"
          }

          if [[ "$EVENT_REF" != refs/heads/main ]]; then
            echo "Select main to stage a package." >&2
            exit 1
          fi
          version=$(read_version package.json)
          stage=true
          case "$EVENT_NAME" in
            push)
              if [[ ! "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Cannot determine the previous version without a push base." >&2
                exit 1
              fi
              git merge-base --is-ancestor "$EVENT_BEFORE" HEAD
              previous=$(git show "$EVENT_BEFORE:package.json" | read_version)
              if [[ "$version" == "$previous" ]]; then
                stage=false
              elif [[ "$(printf '%s\n' "$previous" "$version" | LC_ALL=C sort -V | tail -n 1)" != "$version" ]]; then
                echo "Refusing to stage a version older than $previous." >&2
                exit 1
              fi
              ;;
            workflow_dispatch) ;;
            *) exit 1 ;;
          esac

          node=$(< .nvmrc)
          npm=$(jq -er '.packageManager | strings' package.json)
          if [[ ! "$node" =~ $exact || "$npm" != npm@* || ! "${npm#npm@}" =~ $exact ]]; then
            echo "Node and npm must have exact version pins." >&2
            exit 1
          fi
          printf 'stage=%s\nnode=%s\nnpm=%s\n' "$stage" "$node" "${npm#npm@}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.stage == 'true'
        with:
          node-version: ${{ steps.gate.outputs.node }}
          package-manager-cache: false
      - name: Check release notes
        if: steps.gate.outputs.stage == 'true'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { changelogNotes } from "./scripts/release-notes.ts";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          changelogNotes(readFileSync("CHANGELOG.md", "utf8"), version);
          JS
      - name: Pin npm
        if: steps.gate.outputs.stage == 'true'
        env:
          NPM_VERSION: ${{ steps.gate.outputs.npm }}
        run: npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - name: Install dependencies
        if: steps.gate.outputs.stage == 'true'
        run: npm ci --ignore-scripts --include=dev --no-audit
      - name: Check and test
        if: steps.gate.outputs.stage == 'true'
        run: |
          npm run check
          npm run test:coverage
          npm run audit
      - name: Scan history
        if: steps.gate.outputs.stage == 'true'
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            -v "$PWD:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --ignore-gitleaks-allow --log-opts="--all" /path
      - name: Pack and smoke test
        if: steps.gate.outputs.stage == 'true'
        run: |
          mkdir "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          files=("$RUNNER_TEMP"/release/*.tgz)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          mv "${files[0]}" "$RUNNER_TEMP/release/package.tgz"
          npm run test:package -- "$RUNNER_TEMP/release/package.tgz" 1.6.0
          npm run test:package -- "$RUNNER_TEMP/release/package.tgz" 1.6.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.stage == 'true'
        id: upload
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error

  ci:
    name: Wait for main CI
    needs: verify
    if: needs.verify.outputs.stage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/wait-for-main-ci.sh
          sparse-checkout-cone-mode: false
      - name: Require CI on this commit
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-main-ci.sh

  stage:
    needs: [verify, ci]
    if: needs.verify.outputs.stage == 'true' && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.verify.outputs.node }}
          package-manager-cache: false
      - name: Pin npm
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm }}
        run: npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Stage package
        run: npm stage publish "$RUNNER_TEMP/release/package.tgz" --ignore-scripts --access public
