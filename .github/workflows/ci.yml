name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.23.5'
          - os: ubuntu-24.04
            node: '24.22.3'
          - os: ubuntu-24.04
            node: '26.13.1'
            primary: true
          - os: macos-15
            node: '26.13.1'
          - os: windows-2025
            node: '26.13.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.20.0
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit
      - name: Lint, format, and typecheck
        if: matrix.primary == true
        run: npm run check
      - name: Test with coverage
        if: matrix.primary == true
        run: npm run test:coverage
      - name: Test compatibility
        if: matrix.primary != true
        run: npm test
      - name: Audit dependencies
        if: matrix.primary == true
        run: npm run audit
      - name: Inspect package
        if: matrix.primary == true
        run: npm run pack:check
      - name: Test the release CI gate
        if: matrix.primary == true
        run: bash tests/wait-for-main-ci.test.sh
      - name: Install and load packed extension
        env:
          NPM_CONFIG_OFFLINE: 'true'
        run: npm run test:package

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            -v "$PWD:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --ignore-gitleaks-allow --log-opts="--all" /path

  required:
    name: CI required
    needs: [validate, secrets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all CI jobs to pass
        env:
          VALIDATE: ${{ needs.validate.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          test "$VALIDATE" = success
          test "$SECRETS" = success
